name: Automation Tests Bot
# Trigger Update

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Notify
    # Run only if it's a PR comment containing '/bot' OR a manual trigger
    if: (github.event.issue.pull_request && contains(github.event.comment.body, '/bot')) || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        id: checkout
        uses: actions/checkout@v4
        with:
          # If triggered by comment, checkout the PR code. Otherwise (manual), use default.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: Notify Checkout Status
        if: always()
        run: |
          OUTCOME="${{ steps.checkout.outcome }}"
          ICON="✅"
          if [ "$OUTCOME" != "success" ]; then ICON="❌"; fi
          curl -X POST -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [{ "contentType": "application/vnd.microsoft.card.adaptive", "content": { "$schema": "http://adaptivecards.io/schemas/adaptive-card.json", "type": "AdaptiveCard", "version": "1.2", "body": [{ "type": "TextBlock", "text": "'"$ICON"' Checkout Code: '"$OUTCOME"'", "weight": "Bolder" }] } }]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: Notify Test Start
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "Test Run Started",
                      "weight": "Bolder",
                      "size": "Medium"
                    },
                    {
                      "type": "TextBlock",
                      "text": "[Click here to view workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                      "wrap": true
                    }
                  ]
                }
              }
            ]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        id: dependencies
        run: npm ci

      - name: Notify Dependencies Status
        if: always()
        run: |
          OUTCOME="${{ steps.dependencies.outcome }}"
          ICON="✅"
          if [ "$OUTCOME" != "success" ]; then ICON="❌"; fi
          curl -X POST -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [{ "contentType": "application/vnd.microsoft.card.adaptive", "content": { "$schema": "http://adaptivecards.io/schemas/adaptive-card.json", "type": "AdaptiveCard", "version": "1.2", "body": [{ "type": "TextBlock", "text": "'"$ICON"' Install Dependencies: '"$OUTCOME"'", "weight": "Bolder" }] } }]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: Install Playwright Browsers
        id: browsers
        run: npx playwright install --with-deps

      - name: Notify Browsers Status
        if: always()
        run: |
          OUTCOME="${{ steps.browsers.outcome }}"
          ICON="✅"
          if [ "$OUTCOME" != "success" ]; then ICON="❌"; fi
          curl -X POST -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [{ "contentType": "application/vnd.microsoft.card.adaptive", "content": { "$schema": "http://adaptivecards.io/schemas/adaptive-card.json", "type": "AdaptiveCard", "version": "1.2", "body": [{ "type": "TextBlock", "text": "'"$ICON"' Install Browsers: '"$OUTCOME"'", "weight": "Bolder" }] } }]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: Run Tests
        id: tests
        run: npm run test-qc

      - name: Generate Reports
        if: always()
        run: |
          npm install multiple-cucumber-html-reporter
          npm install archiver
          npm run posttest

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-report
          path: test-results/combined-report.zip
          retention-days: 30

      - name: Post Test Results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const reportPath = 'test-results/cucumber-report.json';
              if (fs.existsSync(reportPath)) {
                const results = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                let passed = 0;
                let failed = 0;
                
                results.forEach(feature => {
                  if (feature.elements) {
                    feature.elements.forEach(scenario => {
                      const isFailed = scenario.steps.some(step => step.result.status === 'failed');
                      if (isFailed) failed++; else passed++;
                    });
                  }
                });
                
                const total = passed + failed;
                const emoji = failed === 0 ? '✅' : '❌';
                
                const body = `### 🎭 Playwright Test Results\n\n` +
                  `| Total | Passed | Failed |\n` +
                  `|-------|--------|--------|\n` +
                  `| ${total} | ${passed} ✅ | ${failed} ❌ |\n\n` +
                  `**Status:** ${emoji} ${failed === 0 ? 'All Tests Passed' : 'Some Tests Failed'}\n\n` +
                  `[Download Full Report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
                  
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              } else {
                console.log('Report file not found, skipping comment.');
              }
            } catch (error) {
              console.error('Error processing test results:', error);
            }

      - name: Microsoft Teams Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON="✅"
          if [ "$STATUS" != "success" ]; then ICON="❌"; fi
          curl -X POST -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "Test Run Completed",
                      "weight": "Bolder",
                      "size": "Medium"
                    },
                    {
                      "type": "TextBlock",
                  ]
                }
              }
            ]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"
