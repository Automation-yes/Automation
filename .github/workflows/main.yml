name: Automation Tests Bot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Notify
    # Run only if it's a PR comment containing '/bot' OR a manual trigger
    if: (github.event.issue.pull_request && contains(github.event.comment.body, '/bot')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # If triggered by comment, checkout the PR code. Otherwise (manual), use default.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: Notify Test Start
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          notification-summary: Test Run Started

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Tests
        run: npm run test-qc

      - name: Microsoft Teams Notification
        if: always()
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ github.token }}
          # Correct input names based on error message
          ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          notification-summary: Test Run Completed
