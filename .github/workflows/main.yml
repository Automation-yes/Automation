name: Automation Tests Bot
# Trigger Update

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  test:
    name: Run Tests & Notify
    # Run only if it's a PR comment containing '/bot' OR a manual trigger
    if: (github.event.issue.pull_request && contains(github.event.comment.body, '/bot')) || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Code
        id: checkout
        uses: actions/checkout@v4
        with:
          # If triggered by comment, checkout the PR code. Otherwise (manual), use default.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: Set Pending Status on PR
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pr.head.sha,
              state: 'pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Tests are running...',
              context: 'Automation Tests'
            });

      - name: Notify Checkout Status
        if: always()
        run: |
          $OUTCOME = "${{ steps.checkout.outcome }}"
          if ($OUTCOME -ne "success") { $ICON = "\u274C" } else { $ICON = "\u2705" }
          $body = @"
          {"type":"message","attachments":[{"contentType":"application/vnd.microsoft.card.adaptive","content":{"$('$')schema":"http://adaptivecards.io/schemas/adaptive-card.json","type":"AdaptiveCard","version":"1.2","body":[{"type":"TextBlock","text":"$ICON Checkout Code: $OUTCOME","weight":"Bolder"}]}}]}
          "@
          $utf8 = [System.Text.Encoding]::UTF8.GetBytes($body)
          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $utf8

      - name: Notify Test Start
        run: |
          $body = @"
          {"type":"message","attachments":[{"contentType":"application/vnd.microsoft.card.adaptive","content":{"$('$')schema":"http://adaptivecards.io/schemas/adaptive-card.json","type":"AdaptiveCard","version":"1.2","body":[{"type":"TextBlock","text":"\u25B6\uFE0F Test Run Started","weight":"Bolder","size":"Medium"},{"type":"TextBlock","text":"[Click here to view workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})","wrap":true}]}}]}
          "@
          $utf8 = [System.Text.Encoding]::UTF8.GetBytes($body)
          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $utf8

      - name: Setup Node.js
        id: setup_node
        run: |
          $nodeVer = $null
          try { $nodeVer = node --version 2>$null } catch {}
          if ($nodeVer) {
            Write-Host "Node.js already installed: $nodeVer"
          } else {
            Write-Host "Node.js not found. Please install Node.js 20 on this self-hosted runner."
            exit 1
          }

      - name: Notify Setup Node Status
        if: always()
        run: |
          $OUTCOME = "${{ steps.setup_node.outcome }}"
          if ($OUTCOME -ne "success") { $ICON = "\u274C" } else { $ICON = "\u2705" }
          $body = @"
          {"type":"message","attachments":[{"contentType":"application/vnd.microsoft.card.adaptive","content":{"$('$')schema":"http://adaptivecards.io/schemas/adaptive-card.json","type":"AdaptiveCard","version":"1.2","body":[{"type":"TextBlock","text":"$ICON Setup Node.js: $OUTCOME","weight":"Bolder"}]}}]}
          "@
          $utf8 = [System.Text.Encoding]::UTF8.GetBytes($body)
          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $utf8

      - name: Install Dependencies
        id: dependencies
        run: npm ci

      - name: Notify Dependencies Status
        if: always()
        run: |
          $OUTCOME = "${{ steps.dependencies.outcome }}"
          if ($OUTCOME -ne "success") { $ICON = "\u274C" } else { $ICON = "\u2705" }
          $body = @"
          {"type":"message","attachments":[{"contentType":"application/vnd.microsoft.card.adaptive","content":{"$('$')schema":"http://adaptivecards.io/schemas/adaptive-card.json","type":"AdaptiveCard","version":"1.2","body":[{"type":"TextBlock","text":"$ICON Install Dependencies: $OUTCOME","weight":"Bolder"}]}}]}
          "@
          $utf8 = [System.Text.Encoding]::UTF8.GetBytes($body)
          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $utf8

      - name: Install Playwright Browsers
        id: browsers
        run: npx playwright install --with-deps

      - name: Notify Browsers Status
        if: always()
        run: |
          $OUTCOME = "${{ steps.browsers.outcome }}"
          if ($OUTCOME -ne "success") { $ICON = "\u274C" } else { $ICON = "\u2705" }
          $body = @"
          {"type":"message","attachments":[{"contentType":"application/vnd.microsoft.card.adaptive","content":{"$('$')schema":"http://adaptivecards.io/schemas/adaptive-card.json","type":"AdaptiveCard","version":"1.2","body":[{"type":"TextBlock","text":"$ICON Install Browsers: $OUTCOME","weight":"Bolder"}]}}]}
          "@
          $utf8 = [System.Text.Encoding]::UTF8.GetBytes($body)
          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $utf8

      - name: Run Tests
        id: tests
        run: |
          $env:HEADLESS = "true"
          npx cucumber-js test --force-exit
          Write-Host "Tests completed, exiting step."
        timeout-minutes: 15

      - name: Kill Orphan Browsers
        if: always()
        run: |
          Get-Process -Name "chrome","chromium","msedge","firefox" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Notify Tests Status
        if: always()
        run: |
          $OUTCOME = "${{ steps.tests.outcome }}"
          if ($OUTCOME -ne "success") { $ICON = "\u274C" } else { $ICON = "\u2705" }
          $body = @"
          {"type":"message","attachments":[{"contentType":"application/vnd.microsoft.card.adaptive","content":{"$('$')schema":"http://adaptivecards.io/schemas/adaptive-card.json","type":"AdaptiveCard","version":"1.2","body":[{"type":"TextBlock","text":"$ICON Run Tests: $OUTCOME","weight":"Bolder"}]}}]}
          "@
          $utf8 = [System.Text.Encoding]::UTF8.GetBytes($body)
          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $utf8

      - name: Generate Reports
        if: always()
        run: |
          npm run posttest
          # Zip all test-results into combined-report.zip
          if (Test-Path "test-results") {
            Compress-Archive -Path "test-results\*" -DestinationPath "test-results\combined-report.zip" -Force
            Write-Host "Created test-results\combined-report.zip"
          } else {
            Write-Host "No test-results directory found"
          }

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-report
          path: test-results/combined-report.zip
          retention-days: 30

      - name: Post Test Results to PR
        if: always() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              // Step statuses
              const icon = (s) => s === 'success' ? '✅' : s === 'failure' ? '❌' : s === 'cancelled' ? '⚠️' : '⏭️';
              const steps = [
                { name: 'Checkout Code', status: '${{ steps.checkout.outcome }}' },
                { name: 'Setup Node.js', status: '${{ steps.setup_node.outcome }}' },
                { name: 'Install Dependencies', status: '${{ steps.dependencies.outcome }}' },
                { name: 'Install Browsers', status: '${{ steps.browsers.outcome }}' },
                { name: 'Run Tests', status: '${{ steps.tests.outcome }}' },
              ];

              let pipelineTable = `| Step | Status |\n|------|--------|\n`;
              steps.forEach(s => {
                pipelineTable += `| ${s.name} | ${icon(s.status)} ${s.status} |\n`;
              });

              // Test results
              let testSection = '';
              const reportPath = 'test-results/cucumber-report.json';
              if (fs.existsSync(reportPath)) {
                const results = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                let passed = 0;
                let failed = 0;
                let scenarioDetails = [];

                results.forEach(feature => {
                  if (feature.elements) {
                    feature.elements.forEach(scenario => {
                      const isFailed = scenario.steps.some(step => step.result && step.result.status === 'failed');
                      if (isFailed) failed++; else passed++;
                      scenarioDetails.push({
                        feature: feature.name,
                        scenario: scenario.name,
                        status: isFailed ? 'Failed' : 'Passed',
                        icon: isFailed ? '❌' : '✅'
                      });
                    });
                  }
                });

                const total = passed + failed;
                const emoji = failed === 0 ? '✅' : '❌';

                testSection = `\n### 🎭 Test Results Summary\n\n` +
                  `| Total | Passed | Failed |\n` +
                  `|-------|--------|--------|\n` +
                  `| ${total} | ${passed} ✅ | ${failed} ❌ |\n\n` +
                  `**Result:** ${emoji} ${failed === 0 ? 'All Tests Passed' : 'Some Tests Failed'}\n\n`;

                if (scenarioDetails.length > 0) {
                  testSection += `<details><summary>📋 Scenario Details</summary>\n\n` +
                    `| Feature | Scenario | Status |\n` +
                    `|---------|----------|--------|\n`;
                  scenarioDetails.forEach(s => {
                    testSection += `| ${s.feature} | ${s.scenario} | ${s.icon} ${s.status} |\n`;
                  });
                  testSection += `\n</details>\n`;
                }
              } else {
                testSection = `\n> ⚠️ No test report found (test-results/cucumber-report.json missing)\n`;
              }

              // Overall status
              const jobStatus = '${{ job.status }}';
              const overallIcon = jobStatus === 'success' ? '✅' : '❌';

              const body = `## 🤖 Automation Bot Report\n\n` +
                `**Overall Status:** ${overallIcon} \`${jobStatus}\`\n\n` +
                `### 🔧 Pipeline Steps\n\n` +
                pipelineTable +
                testSection +
                `\n### 📎 Links\n\n` +
                `- [📄 Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n` +
                `- [📦 Download Report Artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            } catch (error) {
              console.error('Error posting PR comment:', error);
            }

      - name: Update PR Status
        if: always() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            let state = 'failure';
            let description = 'Tests failed';
            
            try {
              const reportPath = 'test-results/cucumber-report.json';
              if (fs.existsSync(reportPath)) {
                const results = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                let passed = 0;
                let failed = 0;
                results.forEach(feature => {
                  if (feature.elements) {
                    feature.elements.forEach(scenario => {
                      const isFailed = scenario.steps.some(step => step.result.status === 'failed');
                      if (isFailed) failed++; else passed++;
                    });
                  }
                });
                if (failed === 0) {
                  state = 'success';
                  description = `All ${passed} tests passed`;
                } else {
                  description = `${failed} of ${passed + failed} tests failed`;
                }
              }
            } catch (e) {
              console.error(e);
            }
            
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pr.head.sha,
              state: state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: description,
              context: 'Automation Tests'
            });

      - name: Microsoft Teams Notification
        if: always()
        run: |
          $STATUS = "${{ job.status }}"
          if ($STATUS -ne "success") { $ICON = "\u274C" } else { $ICON = "\u2705" }
          $body = @"
          {"type":"message","attachments":[{"contentType":"application/vnd.microsoft.card.adaptive","content":{"$('$')schema":"http://adaptivecards.io/schemas/adaptive-card.json","type":"AdaptiveCard","version":"1.2","body":[{"type":"TextBlock","text":"\u2705 Test Run Completed","weight":"Bolder","size":"Medium"},{"type":"TextBlock","text":"$ICON Status: $STATUS","wrap":true},{"type":"TextBlock","text":"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})","wrap":true}]}}]}
          "@
          $utf8 = [System.Text.Encoding]::UTF8.GetBytes($body)
          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $utf8
