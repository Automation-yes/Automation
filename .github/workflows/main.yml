name: Automation Tests Bot
# Trigger Update

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Tests & Notify
    # Run only if it's a PR comment containing '/bot' OR a manual trigger
    if: (github.event.issue.pull_request && contains(github.event.comment.body, '/bot')) || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      # ─── CHECKOUT ───
      - name: Checkout Code
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      # ─── PR PENDING STATUS ───
      - name: Set Pending Status on PR
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pr.head.sha,
              state: 'pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Tests are running...',
              context: 'Automation Tests'
            });

      # ─── TEAMS: START CARD ───
      - name: Teams - Test Run Started
        run: |
          $body = @"
          {"type":"message","attachments":[{"contentType":"application/vnd.microsoft.card.adaptive","content":{"$('$')schema":"http://adaptivecards.io/schemas/adaptive-card.json","type":"AdaptiveCard","version":"1.2","body":[{"type":"TextBlock","text":"\u25B6\uFE0F Automation Test Run Started","weight":"Bolder","size":"Medium","color":"Accent"},{"type":"FactSet","facts":[{"title":"Trigger","value":"${{ github.event_name }}"},{"title":"Run","value":"#${{ github.run_number }}"}]},{"type":"TextBlock","text":"\uD83D\uDD17 [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})","wrap":true}]}}]}
          "@
          $utf8 = [System.Text.Encoding]::UTF8.GetBytes($body)
          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $utf8

      # ─── SETUP ───
      - name: Setup Node.js
        id: setup_node
        run: |
          $nodeVer = $null
          try { $nodeVer = node --version 2>$null } catch {}
          if ($nodeVer) {
            Write-Host "Node.js already installed: $nodeVer"
          } else {
            Write-Host "Node.js not found. Please install Node.js 20 on this self-hosted runner."
            exit 1
          }

      - name: Install Dependencies
        id: dependencies
        run: npm ci

      - name: Install Playwright Browsers
        id: browsers
        run: npx playwright install --with-deps

      # ─── RUN TESTS ───
      - name: Run Tests
        id: tests
        run: |
          $env:HEADLESS = "true"
          npx cucumber-js test --force-exit
          Write-Host "Tests completed, exiting step."
        timeout-minutes: 15

      - name: Kill Orphan Browsers
        if: always()
        run: |
          Get-Process -Name "chrome","chromium","msedge","firefox" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      # ─── GENERATE REPORTS ───
      - name: Generate Reports
        id: reports
        if: always()
        run: |
          # Generate combined HTML report (runs report.ts directly)
          npx ts-node src/test/hooks/report.ts

          # Install portable Java for Allure CLI (if not already present)
          $javaDir = "$env:RUNNER_TOOL_CACHE\java-jre"
          if (-not (Test-Path "$javaDir\bin\java.exe")) {
            Write-Host "Installing portable JRE for Allure..."
            $jreUrl = "https://aka.ms/download-jdk/microsoft-jdk-21.0.6-windows-x64.zip"
            $zipPath = "$env:TEMP\java-jre.zip"
            Invoke-WebRequest -Uri $jreUrl -OutFile $zipPath -UseBasicParsing
            Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\java-extract" -Force
            $extractedDir = Get-ChildItem "$env:TEMP\java-extract" -Directory | Select-Object -First 1
            if (Test-Path $javaDir) { Remove-Item $javaDir -Recurse -Force }
            Move-Item $extractedDir.FullName $javaDir
            Remove-Item $zipPath -Force
            Remove-Item "$env:TEMP\java-extract" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "JRE installed to $javaDir"
          } else {
            Write-Host "JRE already present at $javaDir"
          }
          $env:JAVA_HOME = $javaDir
          $env:PATH = "$javaDir\bin;$env:PATH"

          # Convert Cucumber JSON to Allure results format (inline, branch-independent)
          $cucumberJson = "test-results\cucumber-report.json"
          $allureResultsDir = "test-results\allure-results"
          if (Test-Path $cucumberJson) {
            if (-not (Test-Path $allureResultsDir)) { New-Item -ItemType Directory -Path $allureResultsDir -Force | Out-Null }
            $data = Get-Content $cucumberJson -Raw | ConvertFrom-Json
            $idx = 0
            foreach ($feature in $data) {
              if ($feature.elements) {
                foreach ($scenario in $feature.elements) {
                  $idx++
                  $uuid = [guid]::NewGuid().ToString()
                  $startTime = [long]([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) - 300000
                  $status = "passed"
                  $steps = @()
                  $stepIdx = 0
                  foreach ($step in $scenario.steps) {
                    $stepIdx++
                    $dur = if ($step.result -and $step.result.duration) { [math]::Floor($step.result.duration / 1000000) } else { 1000 }
                    $sStat = if ($step.result -and $step.result.status) { $step.result.status } else { "passed" }
                    if ($sStat -eq "failed") { $status = "failed" }
                    $steps += @{ name = $step.name; status = $sStat; stage = "finished"; start = $startTime + ($stepIdx * 1000); stop = $startTime + ($stepIdx * 1000) + $dur }
                  }
                  $testResult = @{
                    uuid = $uuid
                    name = $scenario.name
                    fullName = "$($feature.name) > $($scenario.name)"
                    start = $startTime
                    stop = $startTime + ($stepIdx * 1000) + 1000
                    status = $status
                    stage = "finished"
                    steps = $steps
                    labels = @(
                      @{ name = "suite"; value = $feature.name },
                      @{ name = "feature"; value = $feature.name },
                      @{ name = "story"; value = $scenario.name }
                    )
                  }
                  $testResult | ConvertTo-Json -Depth 10 | Set-Content "$allureResultsDir\$uuid-result.json"
                }
              }
            }
            Write-Host "Converted Cucumber JSON to $idx Allure result(s)"
          } else {
            Write-Host "No cucumber-report.json found, skipping Allure conversion"
          }

          # Generate Allure HTML report
          if (Test-Path $allureResultsDir) {
            npx -y allure-commandline@2.25.0 generate test-results/allure-results --clean -o test-results/allure-report
            Write-Host "Allure HTML report generated"
          } else {
            Write-Host "No allure-results directory found, skipping Allure generate"
          }

          if (Test-Path "test-results") {
            Compress-Archive -Path "test-results\*" -DestinationPath "test-results\combined-report.zip" -Force
            Write-Host "Created test-results\combined-report.zip"
          } else {
            Write-Host "No test-results directory found"
          }

      # ─── DEPLOY REPORTS TO GITHUB PAGES ───
      - name: Deploy Reports to GitHub Pages
        id: deploy_allure
        if: always()
        run: |
          $combinedDir = "test-results\combined-report"
          $allureDir = "test-results\allure-report"
          $hasCombined = Test-Path $combinedDir
          $hasAllure = Test-Path $allureDir

          if ($hasCombined -or $hasAllure) {
            $runId = "${{ github.run_number }}"

            # Configure git
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Check if gh-pages exists
            $ghPagesBranch = git ls-remote --heads origin gh-pages 2>&1
            if ($ghPagesBranch -match "gh-pages") {
              git fetch origin gh-pages
              git worktree add gh-pages-dir origin/gh-pages
            } else {
              New-Item -ItemType Directory -Path "gh-pages-dir" -Force | Out-Null
              Set-Location gh-pages-dir
              git init
              git checkout --orphan gh-pages
              git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
              Set-Location ..
            }

            # Deploy combined-report (Cucumber HTML)
            if ($hasCombined) {
              $target = "gh-pages-dir\run-$runId\cucumber"
              New-Item -ItemType Directory -Path $target -Force | Out-Null
              Copy-Item -Path "$combinedDir\*" -Destination $target -Recurse -Force
              # Also copy to latest/cucumber
              $latestCucumber = "gh-pages-dir\latest\cucumber"
              if (Test-Path $latestCucumber) { Remove-Item $latestCucumber -Recurse -Force }
              New-Item -ItemType Directory -Path $latestCucumber -Force | Out-Null
              Copy-Item -Path "$combinedDir\*" -Destination $latestCucumber -Recurse -Force
              Write-Host "Deployed Cucumber HTML report"
            }

            # Deploy allure-report (Allure HTML)
            if ($hasAllure) {
              $target = "gh-pages-dir\run-$runId\allure"
              New-Item -ItemType Directory -Path $target -Force | Out-Null
              Copy-Item -Path "$allureDir\*" -Destination $target -Recurse -Force
              # Also copy to latest/allure
              $latestAllure = "gh-pages-dir\latest\allure"
              if (Test-Path $latestAllure) { Remove-Item $latestAllure -Recurse -Force }
              New-Item -ItemType Directory -Path $latestAllure -Force | Out-Null
              Copy-Item -Path "$allureDir\*" -Destination $latestAllure -Recurse -Force
              Write-Host "Deployed Allure HTML report"
            }

            # Create root index.html with links to both reports
            $baseUrl = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
            $indexContent = '<!DOCTYPE html><html><head><title>Test Reports</title><style>body{font-family:Arial,sans-serif;max-width:600px;margin:60px auto;text-align:center}a{display:block;margin:20px;padding:15px;background:#0366d6;color:white;text-decoration:none;border-radius:8px;font-size:18px}a:hover{background:#0256b9}</style></head><body><h1>Test Reports</h1><a href="latest/cucumber/index.html">Cucumber HTML Report (Latest)</a><a href="latest/allure/index.html">Allure Report (Latest)</a><p style="margin-top:40px;color:#666">Run #' + $runId + '</p></body></html>'
            [System.IO.File]::WriteAllText("$PWD\gh-pages-dir\index.html", $indexContent)

            # Commit and push
            Set-Location gh-pages-dir
            git add -A
            git commit -m "Test Reports - Run #$runId" --allow-empty
            git push origin HEAD:gh-pages --force
            Set-Location ..
            git worktree remove gh-pages-dir --force 2>$null

            $CUCUMBER_URL = "$baseUrl/run-$runId/cucumber/index.html"
            $ALLURE_URL = "$baseUrl/run-$runId/allure/index.html"
            $REPORT_LATEST = "$baseUrl/latest/cucumber/index.html"
            $ALLURE_LATEST = "$baseUrl/latest/allure/index.html"
            Write-Host "Cucumber Report: $CUCUMBER_URL"
            Write-Host "Allure Report: $ALLURE_URL"
            echo "ALLURE_URL=$ALLURE_URL" >> $env:GITHUB_ENV
            echo "ALLURE_LATEST=$ALLURE_LATEST" >> $env:GITHUB_ENV
            echo "CUCUMBER_URL=$CUCUMBER_URL" >> $env:GITHUB_ENV
            echo "REPORT_LATEST=$REPORT_LATEST" >> $env:GITHUB_ENV
          } else {
            Write-Host "No reports found to deploy"
            echo "ALLURE_URL=" >> $env:GITHUB_ENV
            echo "ALLURE_LATEST=" >> $env:GITHUB_ENV
            echo "CUCUMBER_URL=" >> $env:GITHUB_ENV
            echo "REPORT_LATEST=" >> $env:GITHUB_ENV
          }

      # ─── UPLOAD ARTIFACT ───
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-report
          path: test-results/combined-report.zip
          retention-days: 30

      # ─── POST PR COMMENT ───
      - name: Post Test Results to PR
        if: always() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const icon = (s) => s === 'success' ? '✅' : s === 'failure' ? '❌' : s === 'cancelled' ? '⚠️' : '⏭️';
              const steps = [
                { name: 'Checkout Code', status: '${{ steps.checkout.outcome }}' },
                { name: 'Setup Node.js', status: '${{ steps.setup_node.outcome }}' },
                { name: 'Install Dependencies', status: '${{ steps.dependencies.outcome }}' },
                { name: 'Install Browsers', status: '${{ steps.browsers.outcome }}' },
                { name: 'Run Tests', status: '${{ steps.tests.outcome }}' },
                { name: 'Generate Reports', status: '${{ steps.reports.outcome }}' },
                { name: 'Deploy Report', status: '${{ steps.deploy_allure.outcome }}' },
              ];

              let pipelineTable = `| Step | Status |\n|------|--------|\n`;
              steps.forEach(s => {
                pipelineTable += `| ${s.name} | ${icon(s.status)} ${s.status} |\n`;
              });

              let testSection = '';
              const reportPath = 'test-results/cucumber-report.json';
              if (fs.existsSync(reportPath)) {
                const results = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                let passed = 0;
                let failed = 0;
                let scenarioDetails = [];

                results.forEach(feature => {
                  if (feature.elements) {
                    feature.elements.forEach(scenario => {
                      const isFailed = scenario.steps.some(step => step.result && step.result.status === 'failed');
                      if (isFailed) failed++; else passed++;
                      scenarioDetails.push({
                        feature: feature.name,
                        scenario: scenario.name,
                        status: isFailed ? 'Failed' : 'Passed',
                        icon: isFailed ? '❌' : '✅'
                      });
                    });
                  }
                });

                const total = passed + failed;
                const emoji = failed === 0 ? '✅' : '❌';

                testSection = `\n### 🎭 Test Results Summary\n\n` +
                  `| Total | Passed | Failed |\n` +
                  `|-------|--------|--------|\n` +
                  `| ${total} | ${passed} ✅ | ${failed} ❌ |\n\n` +
                  `**Result:** ${emoji} ${failed === 0 ? 'All Tests Passed' : 'Some Tests Failed'}\n\n`;

                if (scenarioDetails.length > 0) {
                  testSection += `<details><summary>📋 Scenario Details</summary>\n\n` +
                    `| Feature | Scenario | Status |\n` +
                    `|---------|----------|--------|\n`;
                  scenarioDetails.forEach(s => {
                    testSection += `| ${s.feature} | ${s.scenario} | ${s.icon} ${s.status} |\n`;
                  });
                  testSection += `\n</details>\n`;
                }
              } else {
                testSection = `\n> ⚠️ No test report found (test-results/cucumber-report.json missing)\n`;
              }

              const jobStatus = '${{ job.status }}';
              const overallIcon = jobStatus === 'success' ? '✅' : '❌';
              const allureUrl = '${{ env.ALLURE_URL }}' || '';
              const allureLatest = '${{ env.ALLURE_LATEST }}' || '';

              let linksSection = `\n### 📎 Links\n\n` +
                `- [📄 Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n` +
                `- [📦 Download Report Artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;

              if (allureUrl) {
                linksSection += `- [📊 Test Report (This Run)](${allureUrl})\n`;
              }
              if (allureLatest) {
                linksSection += `- [📊 Test Report (Latest)](${allureLatest})\n`;
              }

              const body = `## 🤖 Automation Bot Report\n\n` +
                `**Overall Status:** ${overallIcon} \`${jobStatus}\`\n\n` +
                `### 🔧 Pipeline Steps\n\n` +
                pipelineTable +
                testSection +
                linksSection;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            } catch (error) {
              console.error('Error posting PR comment:', error);
            }

      # ─── UPDATE PR STATUS ───
      - name: Update PR Status
        if: always() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            let state = 'failure';
            let description = 'Tests failed';

            try {
              const reportPath = 'test-results/cucumber-report.json';
              if (fs.existsSync(reportPath)) {
                const results = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                let passed = 0;
                let failed = 0;
                results.forEach(feature => {
                  if (feature.elements) {
                    feature.elements.forEach(scenario => {
                      const isFailed = scenario.steps.some(step => step.result.status === 'failed');
                      if (isFailed) failed++; else passed++;
                    });
                  }
                });
                if (failed === 0) {
                  state = 'success';
                  description = `All ${passed} tests passed`;
                } else {
                  description = `${failed} of ${passed + failed} tests failed`;
                }
              }
            } catch (e) {
              console.error(e);
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pr.head.sha,
              state: state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: description,
              context: 'Automation Tests'
            });

      # ─── TEAMS: FINAL SUMMARY CARD ───
      - name: Teams - Final Summary
        if: always()
        run: |
          $STATUS = "${{ job.status }}"
          $CHECKOUT = "${{ steps.checkout.outcome }}"
          $NODE = "${{ steps.setup_node.outcome }}"
          $DEPS = "${{ steps.dependencies.outcome }}"
          $BROWSERS = "${{ steps.browsers.outcome }}"
          $TESTS = "${{ steps.tests.outcome }}"
          $REPORTS = "${{ steps.reports.outcome }}"
          $ALLURE_DEPLOY = "${{ steps.deploy_allure.outcome }}"

          function Get-Icon($s) {
            if ($s -eq "success") { return "\u2705" }
            elseif ($s -eq "failure") { return "\u274C" }
            elseif ($s -eq "cancelled") { return "\u26A0\uFE0F" }
            else { return "\u23ED\uFE0F" }
          }

          $iCheckout = Get-Icon $CHECKOUT
          $iNode = Get-Icon $NODE
          $iDeps = Get-Icon $DEPS
          $iBrowsers = Get-Icon $BROWSERS
          $iTests = Get-Icon $TESTS
          $iReports = Get-Icon $REPORTS
          $iAllure = Get-Icon $ALLURE_DEPLOY

          if ($STATUS -eq "success") { $headerIcon = "\u2705"; $headerColor = "Good" }
          else { $headerIcon = "\u274C"; $headerColor = "Attention" }

          $ALLURE_URL = "$env:ALLURE_URL"
          $allureBlock = ""
          if ($ALLURE_URL -ne "") {
            $allureBlock = ",{`"type`":`"TextBlock`",`"text`":`"\uD83D\uDCCA [View Test Report]($ALLURE_URL)`",`"wrap`":true}"
          }

          $body = @"
          {"type":"message","attachments":[{"contentType":"application/vnd.microsoft.card.adaptive","content":{"$('$')schema":"http://adaptivecards.io/schemas/adaptive-card.json","type":"AdaptiveCard","version":"1.2","body":[{"type":"TextBlock","text":"$headerIcon Test Run #${{ github.run_number }} Complete","weight":"Bolder","size":"Medium","color":"$headerColor"},{"type":"FactSet","facts":[{"title":"Overall","value":"$STATUS"},{"title":"Checkout","value":"$iCheckout $CHECKOUT"},{"title":"Node.js","value":"$iNode $NODE"},{"title":"Dependencies","value":"$iDeps $DEPS"},{"title":"Browsers","value":"$iBrowsers $BROWSERS"},{"title":"Tests","value":"$iTests $TESTS"},{"title":"Reports","value":"$iReports $REPORTS"},{"title":"Allure Deploy","value":"$iAllure $ALLURE_DEPLOY"}]},{"type":"TextBlock","text":"\uD83D\uDD17 [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})","wrap":true}$allureBlock]}}]}
          "@
          $utf8 = [System.Text.Encoding]::UTF8.GetBytes($body)
          Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $utf8
